<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quiz Settings</h1>
        <form id="settings-form">
            <div class="setting">
                <label for="json-input">Paste Quiz JSON here:</label>
                <textarea id="json-input" rows="10" cols="50" required></textarea>
            </div>
            <div class="setting">
                <label for="negative-marking">Negative Marking (e.g., 0.25):</label>
                <input type="number" id="negative-marking" value="0" step="0.25">
            </div>
            <div class="setting">
                <label for="total-time">Total Quiz Time (minutes):</label>
                <input type="number" id="total-time" value="60">
            </div>
            <div class="setting">
                <label for="time-per-question">Time per Question (seconds):</label>
                <input type="number" id="time-per-question" value="15">
            </div>
            <button type="submit" class="start-btn">Start Quiz</button>
        </form>
    </div>
    <script src="settings.js"></script>
</body>
</html>
