<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Attempt History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom mb-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">← Back</a>
      <span class="navbar-text">Attempt History</span>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-4 mb-3">
        <div class="card h-100">
          <div class="card-header">Attempts</div>
          <div class="list-group list-group-flush" id="attempts-list">
            <!-- Attempts populated by JS -->
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span id="attempt-title">Select an attempt</span>
            <a id="retake-link" href="quiz.html" class="btn btn-sm btn-outline-primary">Start New Quiz</a>
          </div>
          <div class="card-body" id="attempt-details">
            <p class="text-muted mb-0">Your attempt details will appear here.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="history.js"></script>
</body>
</html>
