<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock Test - Sectional</title>
  <meta name="color-scheme" content="light dark" />
  <!-- Material Icons for checkmark -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    /* ======================================================================
       THEME — warm neutrals, no blue. Accents: amber, terracotta, emerald.
       ====================================================================== */
    :root{
      --bg-1: 247 243 232;
      --bg-2: 241 234 220;
      --fg: 27 31 35;
      --muted: 117 109 100;
      --card: 255 255 255 / 0.76;
      --stroke: 0 0 0 / 0.1;

      --amber: 255 183 3;
      --terracotta: 231 111 81;
      --emerald: 42 157 143;
      --danger: 226 74 74;
      --slate: 60 60 64;

      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;

      --shadow-1: 0 10px 30px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.06);
      --shadow-2: 0 16px 50px rgba(0,0,0,.15), 0 6px 16px rgba(0,0,0,.10);

      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";

      --ease-1: cubic-bezier(.2,.7,.3,1);
      --ease-2: cubic-bezier(.16,1,.3,1);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg-1: 20 18 16;
        --bg-2: 28 26 24;
        --fg: 235 232 226;
        --muted: 168 160 150;
        --card: 255 255 255 / 0.06;
        --stroke: 255 255 255 / 0.12;
        --shadow-1: 0 20px 60px rgba(0,0,0,.5), 0 6px 20px rgba(0,0,0,.4);
        --shadow-2: 0 24px 70px rgba(0,0,0,.55), 0 10px 28px rgba(0,0,0,.35);
      }
    }

    /* Base */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:rgb(var(--fg));
      font-family:var(--font);
      background:
        radial-gradient(1200px 800px at 10% 10%, rgb(var(--bg-2)), transparent 60%),
        radial-gradient(1200px 800px at 90% 85%, rgb(var(--bg-1)), transparent 60%),
        linear-gradient(180deg, rgb(var(--bg-1)), rgb(var(--bg-2)));
      line-height:1.6;
    }
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}

    /* Header */
    header{
      position:sticky; top:0; z-index:30;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:10px 16px;
      background:color-mix(in oklab, rgb(var(--card)) 100%, transparent);
      backdrop-filter:saturate(140%) blur(10px);
      border-bottom:1px solid rgb(var(--stroke));
      box-shadow:var(--shadow-1);
    }
    header h5{margin:0; font-weight:800; letter-spacing:-.01em}
    .timer-container{
      display:flex; align-items:center; gap:10px;
      color:rgb(var(--muted));
    }
    .timer-box{
      font-variant-tabular-nums: tabular-nums;
      background:rgba(0,0,0,.06);
      border:1px solid rgba(0,0,0,.08);
      padding:6px 10px; border-radius:10px; color:rgb(var(--fg));
    }
    @media (prefers-color-scheme: dark){
      .timer-box{background:rgba(255,255,255,.06); border-color: rgba(255,255,255,.12);}
    }
    #fullscreen-btn{
      border-radius:10px; padding:6px 10px; cursor:pointer;
      border:1px solid rgba(0,0,0,.12); background:transparent;
      transition:transform .15s var(--ease-2), border-color .2s;
    }
    #fullscreen-btn:hover{ transform:translateY(-1px); border-color: rgba(255,183,3,.6); }

    /* Layout */
    .wrap{max-width:1760px; margin:12px auto; padding:0 8px; display:grid; grid-template-columns: minmax(0, 1fr) 420px; gap:16px;}
    @media (max-width: 1100px){ .wrap{grid-template-columns: 1.4fr .9fr;} }
    @media (max-width: 900px){ .wrap{grid-template-columns: 1fr;} }

    /* Card-like sections */
    .question-area, .right-panel{
      background:color-mix(in oklab, rgb(var(--card)) 100%, transparent);
      border:1px solid rgb(var(--stroke));
      border-radius:16px; box-shadow:var(--shadow-1);
      overflow:hidden;
    }
    .question-area{ padding:20px; }
    .right-panel{ padding:16px; position:sticky; top:76px; align-self:start; justify-self:end; width:420px; max-width:420px; margin-left:auto; }

    /* Tabs */
    .tabs{ display:flex; gap:8px; flex-wrap:wrap; }
    .tab{
      padding:8px 12px; border-radius:999px; border:1px solid rgba(0,0,0,.08);
      background:rgba(255,255,255,.6);
      cursor:pointer; user-select:none; font-weight:700; color:rgb(var(--fg));
      transition:transform .15s var(--ease-2), box-shadow .2s, border-color .2s;
    }
    @media (prefers-color-scheme: dark){ .tab{background:rgba(255,255,255,.06); border-color: rgba(255,255,255,.12);} }
    .tab:hover{ transform:translateY(-1px); border-color: rgba(255,183,3,.6); }
    .tab.active{
      background:linear-gradient(135deg, rgba(255,183,3,.95), rgba(231,111,81,.95));
      color:#1b1f23;
      box-shadow:var(--shadow-2);
    }

    /* Question */
    .question-content{ margin-top:12px; }
    #question-number{ font-weight:800; margin-bottom:8px; }
    #question-text{ font-size:1.2rem; line-height:1.7; }

    /* Options */
    .option{
      display:flex; gap:12px; align-items:flex-start;
      padding:14px 16px; border-radius:14px; border:1px solid rgba(0,0,0,.08);
      background:rgba(255,255,255,.6); cursor:pointer;
      transition: background .2s, border-color .2s, transform .1s;
      margin-bottom:12px; font-size:1rem;
    }
    @media (prefers-color-scheme: dark){ .option{background:rgba(255,255,255,.06); border-color: rgba(255,255,255,.12);} }
    .option:hover{ transform:translateY(-1px); border-color: rgba(255,183,3,.6); }
    .option input[type="radio"]{ margin-top:2px; transform: scale(1.2); }
    .option.correct{ border-color: rgba(42,157,143,.7); background: rgba(42,157,143,.08); }
    .option.selected{ border-color: rgba(255,183,3,.8); background: rgba(255,183,3,.12); }

    /* Bottom nav (sticky) */
    .bottom-nav{
      position:sticky; bottom:0; z-index:20;
      display:flex; justify-content:space-between; align-items:center;
      gap:12px; padding:10px 12px; margin-top:12px;
      background:color-mix(in oklab, rgb(var(--card)) 100%, transparent);
      border:1px solid rgb(var(--stroke)); border-radius:12px; box-shadow:var(--shadow-1);
    }
    .btn{
      border-radius:12px; padding:10px 14px; font-weight:800; letter-spacing:.01em; cursor:pointer;
      border:1px solid rgba(0,0,0,.1); background:transparent; color:rgb(var(--fg));
      transition:transform .15s var(--ease-2), border-color .2s, background .2s;
    }
    .btn:hover{ transform:translateY(-1px); border-color: rgba(255,183,3,.6); }
    .btn-primary{
      background:linear-gradient(135deg, rgba(255,183,3,.95), rgba(231,111,81,.95)); color:#1b1f23; border:none;
      box-shadow:var(--shadow-2);
    }
    .btn-danger{ background: rgba(226,74,74,.12); border-color: rgba(226,74,74,.5); color: rgb(var(--fg)); }
    .btn-success{
      background:linear-gradient(135deg, rgba(42,157,143,.95), rgba(255,183,3,.95)); color:#1b1f23; border:none;
      box-shadow:var(--shadow-2);
    }

    /* Right panel */
    .user-info img{ width:40px; height:40px; border-radius:50%; }
    .legend{
      border:1px solid rgb(var(--stroke)); border-radius:12px; padding:10px; background:rgba(255,255,255,.6);
    }
    @media (prefers-color-scheme: dark){ .legend{background: rgba(255,255,255,.06);} }
    .legend-item{ display:flex; align-items:center; gap:6px; margin:6px 8px; }
    .legend .box{ width:16px; height:16px; border-radius:4px; display:inline-block; border:1px solid rgba(0,0,0,.15); }
    .answered{ background: rgba(42,157,143,.9); border-color: rgba(42,157,143,1); }
    .not-answered{ background: rgba(226,74,74,.85); border-color: rgba(226,74,74,1); }
    .not-visited{ background: rgba(0,0,0,.15); border-color: rgba(0,0,0,.25); }
    .marked{ background: rgba(255,183,3,.95); border-color: rgba(255,183,3,1); }
    .marked-answered{
      background: linear-gradient(135deg, rgba(42,157,143,.95), rgba(255,183,3,.95));
      border-color: rgba(42,157,143,1);
    }

    /* Section title and palette */
    .section-title{ margin-top:6px; padding-top:8px; }
    #section-title-text{ margin:0 0 6px 0; }

    .question-palette{
      display:grid; grid-template-columns: repeat(8, 1fr); gap:10px;
    }
    @media (max-width:1400px){ .question-palette{ grid-template-columns: repeat(7, 1fr);} }
    @media (max-width:1200px){ .question-palette{ grid-template-columns: repeat(6, 1fr);} }
    @media (max-width:1024px){ .question-palette{ grid-template-columns: repeat(5, 1fr);} }
    @media (max-width:500px){ .question-palette{ grid-template-columns: repeat(4, 1fr);} }

    .pal-btn{
      position:relative;
      display:grid; place-items:center;
      height:46px; border-radius:12px;
      font-weight:800; cursor:pointer; user-select:none; font-size:.95rem;
      border:1px solid rgba(0,0,0,.12);
      background:rgba(255,255,255,.6);
      transition: transform .12s var(--ease-2), border-color .2s, box-shadow .2s, background .2s;
    }
    @media (prefers-color-scheme: dark){ .pal-btn{background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12);} }
    .pal-btn:hover{ transform:translateY(-1px); border-color: rgba(255,183,3,.6); }
    .pal-btn.active{ outline:2px solid rgba(255,183,3,.9); outline-offset: 1px; }

    /* Palette states (match legend) */
    .pal-answered{ background: rgba(42,157,143,.9); color:#0f1b18; border-color: rgba(42,157,143,1); }
    .pal-not-answered{ background: rgba(226,74,74,.9); color:#1b1f23; border-color: rgba(226,74,74,1); }
    .pal-not-visited{ background: rgba(0,0,0,.12); color:#fff; border-color: rgba(0,0,0,.25); }
    .pal-marked{ background: rgba(255,183,3,.95); color:#1b1f23; border-color: rgba(255,183,3,1); }
    .pal-marked-answered{ background: linear-gradient(135deg, rgba(42,157,143,.95), rgba(255,183,3,.95)); color:#1b1f23; }

    /* Tooltip */
    .pal-btn[data-title]:hover::after{
      content: attr(data-title);
      position:absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
      background:#1b1f23; color:#fff; padding:4px 8px; font-size:.78rem; border-radius:6px; white-space:nowrap;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }

    /* Result summary */
    #result-summary{ border-radius:12px; border:1px solid rgb(var(--stroke)); background:rgba(255,255,255,.6); padding:16px; }
    @media (prefers-color-scheme: dark){ #result-summary{ background: rgba(255,255,255,.06); } }

    /* Animations */
    .fade-in{ animation:fade-in .35s var(--ease-2) both; }
    @keyframes fade-in{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
    .shake{ animation:shake .45s ease both; }
    @keyframes shake{
      10%,90%{transform:translateX(-1px)}
      20%,80%{transform:translateX(2px)}
      30%,50%,70%{transform:translateX(-4px)}
      40%,60%{transform:translateX(4px)}
    }

    /* Focus visibility */
    :focus-visible{ outline:2px solid rgba(255,183,3,.9); outline-offset:2px; border-radius:8px; }

    /* Footer space */
    .spacer{ height:14px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h5 class="mb-0">SSC Stenographer 2025 — Free Mock Test</h5>
    <div class="timer-container">
      <span>Time Left</span>
      <div id="timer" class="timer-box">
        <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span>
      </div>
    </div>
    <button id="fullscreen-btn" class="btn" type="button">Toggle Fullscreen</button>
  </header>

  <!-- Main -->
  <div class="wrap">
    <!-- Left column -->
    <div>
      <div class="question-area">
        <!-- Tabs -->
        <div class="tabs" id="tabs"></div>

        <!-- Content -->
        <div class="question-content fade-in">

          <p id="question-number">No. 1</p>
          <div id="question-text" class="mb-3"></div>

          <div id="options-container"></div>
        </div>
      </div>

      <!-- Bottom nav -->
      <div id="test-navigation-btns" class="bottom-nav">
        <div class="d-flex gap-2">
          <button id="mark-review-btn" class="btn btn-primary" type="button">Mark for Review & Next</button>
          <button id="clear-response-btn" class="btn btn-danger" type="button">Clear Response</button>
        </div>
        <button id="save-next-btn" class="btn btn-success" type="button">Save & Next</button>
      </div>

      <div class="spacer"></div>
    </div>

    <!-- Right column -->
    <aside class="right-panel">
      <div class="user-info d-flex align-items-center mb-3">
        <img src="https://via.placeholder.com/40" alt="User avatar">
        <span class="ms-2 fw-bold">Guest User</span>
      </div>

      <div class="legend mb-3">
        <div class="d-flex justify-content-around flex-wrap">
          <span class="legend-item"><span class="box answered"></span> Answered</span>
          <span class="legend-item"><span class="box not-answered"></span> Not Answered</span>
          <span class="legend-item"><span class="box not-visited"></span> Not Visited</span>
          <span class="legend-item"><span class="box marked"></span> Marked</span>
          <span class="legend-item"><span class="box marked-answered"></span> Marked & Answered</span>
        </div>
      </div>

      <div class="section-title border-top pt-2">
        <p class="fw-bold" id="section-title-text">Section: General Awareness</p>
        <div id="question-palette" class="question-palette"></div>
      </div>

      <div class="d-grid gap-2 mt-3">
        <button class="btn" type="button">Question Paper</button>
        <button class="btn" type="button">Instructions</button>
        <button id="submit-test-btn" class="btn btn-primary" type="button">Submit Test</button>
      </div>
    </aside>
  </div>

  <script>
    // --------------------------- Data structure ---------------------------
    function buildSectionsFromStorage(){
      try{
        const raw = JSON.parse(localStorage.getItem('quizQuestions') || 'null');
        if (Array.isArray(raw) && raw.length){
          const groups = new Map();
          for (const q of raw){
            const section = q.section || 'General';
            if (!groups.has(section)) groups.set(section, []);
            const correctIndex = (typeof q.correct_option === 'number' && isFinite(q.correct_option)) ? (q.correct_option - 1) : null;
            groups.get(section).push({ q: q.question || '', options: Array.isArray(q.options) ? q.options : [], correct: correctIndex });
          }
          return Array.from(groups.entries()).map(([name, questions]) => ({ name, questions }));
        }
      }catch(e){ /* ignore and fallback */ }
      // Fallback demo
      return [
        { name: 'General Awareness', questions: [
          { q: 'Who is known as the Father of the Nation in India?', options: ['Sardar Patel', 'Mahatma Gandhi', 'Jawaharlal Nehru', 'B. R. Ambedkar'], correct: 1 },
          { q: 'Which is the largest planet in our Solar System?', options: ['Earth','Jupiter','Saturn','Venus'], correct: 1 },
          { q: 'The capital of Gujarat is?', options: ['Ahmedabad','Surat','Gandhinagar','Rajkot'], correct: 2 },
        ]},
        { name: 'English Language', questions: [
          { q: 'Choose the correct synonym for "candid".', options: ['Frank','Evasive','Dubious','Subtle'], correct: 0 },
          { q: 'Identify the correctly punctuated sentence.', options: [
            'However I will try to attend.',
            'However, I will try to attend.',
            'However I will try, to attend.',
            'However; I will try to attend.',
          ], correct: 1 },
          { q: 'Pick the correct spelling.', options: ['Accomodate','Acommodate','Acccommodate','Accommodate'], correct: 3 },
        ]},
        { name: 'Logical Reasoning', questions: [
          { q: 'Find the missing number: 2, 6, 12, 20, ?', options: ['28','30','32','34'], correct: 0 },
          { q: 'If ALL = 27, BAT = 43, then CAT = ?', options: ['45','46','47','48'], correct: 2 },
          { q: 'Which is different: Circle, Triangle, Square, Cylinder?', options: ['Circle','Triangle','Square','Cylinder'], correct: 3 },
        ]},
      ];
    }
    let sections = buildSectionsFromStorage();

    // --------------------------- State ---------------------------
    let currentSectionIndex = 0;
    let currentQuestionIndex = 0;
    const state = {}; // key: "s-q" -> { sel, marked, visited }

    // --------------------------- Elements ---------------------------
    const tabsWrap = document.getElementById('tabs');
    const qNumEl = document.getElementById('question-number');
    const qTextEl = document.getElementById('question-text');
    const optionsEl = document.getElementById('options-container');
    const paletteEl = document.getElementById('question-palette');
    const sectionTitleEl = document.getElementById('section-title-text');

    const markReviewBtn = document.getElementById('mark-review-btn');
    const clearBtn = document.getElementById('clear-response-btn');
    const saveNextBtn = document.getElementById('save-next-btn');
    const submitBtn = document.getElementById('submit-test-btn');

    const fsBtn = document.getElementById('fullscreen-btn');

    // Timer setup (example: 45 minutes)
    let remaining = 45 * 60; // seconds
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function tick(){
      if (remaining <= 0){
        clearInterval(timer);
        finalize();
        return;
      }
      remaining--;
      const h = String(Math.floor(remaining / 3600)).padStart(2,'0');
      const m = String(Math.floor((remaining % 3600) / 60)).padStart(2,'0');
      const s = String(remaining % 60).padStart(2,'0');
      hoursEl.textContent = h; minutesEl.textContent = m; secondsEl.textContent = s;
    }
    const timer = setInterval(tick, 1000); tick();

    // --------------------------- Rendering ---------------------------
    function key(s, q){ return s + '-' + q; }

    function setVisited(s, q){
      const k = key(s,q);
      state[k] = state[k] || {};
      state[k].visited = true;
    }

    function renderQuestion(){
      const sec = sections[currentSectionIndex];
      const q = sec.questions[currentQuestionIndex];

      setVisited(currentSectionIndex, currentQuestionIndex);

      qNumEl.textContent = `No. ${currentQuestionIndex + 1}`;
      qTextEl.textContent = q.q;

      optionsEl.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const st = state[key(currentSectionIndex, currentQuestionIndex)] || {};
        const selected = st.sel === idx;
        const div = document.createElement('label');
        div.className = 'option' + (selected ? ' selected' : '');
        div.innerHTML = `
          <input type="radio" name="opt" ${selected ? 'checked' : ''} />
          <span>${opt}</span>
        `;
        div.addEventListener('click', () => {
          st.sel = idx;
          state[key(currentSectionIndex, currentQuestionIndex)] = st;
          renderPalette();
          renderQuestion(); // re-render to update selection style
        });
        optionsEl.appendChild(div);
      });

      sectionTitleEl.textContent = `Section: ${sec.name}`;
      // Update active tab state
      Array.from(tabsWrap.children).forEach((t,i)=> t.classList.toggle('active', i===currentSectionIndex));
    }

    function statusFor(s, q){
      const st = state[key(s,q)] || {};
      const sec = sections[s];
      const isAnswered = typeof st.sel === 'number';
      const isMarked = !!st.marked;
      const visited = !!st.visited;
      if (isMarked && isAnswered) return 'marked-answered';
      if (isMarked) return 'marked';
      if (isAnswered) return 'answered';
      return visited ? 'not-answered' : 'not-visited';
    }

    function renderPalette(){
      paletteEl.innerHTML = '';
      const sec = sections[currentSectionIndex];
      sec.questions.forEach((_, i) => {
        const st = statusFor(currentSectionIndex, i);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `pal-btn pal-${st}` + (i===currentQuestionIndex ? ' active' : '');
        btn.textContent = i+1;
        btn.dataset.title = st.replace('-', ' ');
        btn.addEventListener('click', () => {
          currentQuestionIndex = i;
          renderQuestion();
          renderPalette();
          document.querySelector('.question-content').classList.add('fade-in');
          setTimeout(()=>document.querySelector('.question-content').classList.remove('fade-in'), 350);
        });
        paletteEl.appendChild(btn);
      });
    }

    // --------------------------- Actions ---------------------------
    function nextQuestion(){
      const sec = sections[currentSectionIndex];
      if (currentQuestionIndex < sec.questions.length - 1){
        currentQuestionIndex++;
      } else {
        // move to next section if any
        if (currentSectionIndex < sections.length - 1){
          currentSectionIndex++;
          currentQuestionIndex = 0;
        }
      }
      renderTabs();
    renderQuestion(); renderPalette();
    }

    markReviewBtn.addEventListener('click', () => {
      const st = state[key(currentSectionIndex, currentQuestionIndex)] || {};
      st.marked = true;
      state[key(currentSectionIndex, currentQuestionIndex)] = st;
      renderPalette();
      nextQuestion();
    });

    clearBtn.addEventListener('click', () => {
      const st = state[key(currentSectionIndex, currentQuestionIndex)] || {};
      delete st.sel;
      state[key(currentSectionIndex, currentQuestionIndex)] = st;
      renderQuestion(); renderPalette();
      document.querySelector('.question-area').classList.add('shake');
      setTimeout(()=>document.querySelector('.question-area').classList.remove('shake'), 450);
    });

    saveNextBtn.addEventListener('click', nextQuestion);

    submitBtn.addEventListener('click', finalize);

    function renderTabs(){
      tabsWrap.innerHTML = '';
      sections.forEach((sec, i) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (i===currentSectionIndex ? ' active' : '');
        btn.type = 'button';
        btn.textContent = sec.name;
        btn.addEventListener('click', () => {
          currentSectionIndex = i;
          currentQuestionIndex = 0;
          renderQuestion(); renderPalette(); renderTabs();
        });
        tabsWrap.appendChild(btn);
      });
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e)=>{
      if (e.key === 'ArrowRight') nextQuestion();
      if (e.key === '1' || e.key === '2' || e.key === '3' || e.key === '4'){
        const idx = parseInt(e.key, 10) - 1;
        const st = state[key(currentSectionIndex, currentQuestionIndex)] || {};
        if (sections[currentSectionIndex].questions[currentQuestionIndex].options[idx] !== undefined){
          st.sel = idx; state[key(currentSectionIndex, currentQuestionIndex)] = st;
          renderQuestion(); renderPalette();
        }
      }
    });

    // Fullscreen
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    });

    // --------------------------- Results ---------------------------
    function finalize(){
      // Build attempt compatible with history.js from inline quiz model
      const sectionsSummary = sections.map((sec, sIdx) => {
        let answered=0, correct=0;
        sec.questions.forEach((q, qIdx) => {
          const st = state[key(sIdx,qIdx)] || {};
          if (typeof st.sel === 'number') {
            answered++;
            if (st.sel === q.correct) correct++;
          }
        });
        return {answered, correct, total: sec.questions.length};
      });

      const totalQuestions = sectionsSummary.reduce((a,b)=>a+b.total,0);
      const attempted = sectionsSummary.reduce((a,b)=>a+b.answered,0);
      const correct = sectionsSummary.reduce((a,b)=>a+b.correct,0);
      const incorrect = Math.max(0, attempted - correct);
      const unattempted = Math.max(0, totalQuestions - attempted);

      const attemptId = Date.now();
      const attempt = {
        id: attemptId,
        createdAt: new Date().toISOString(),
        settings: {},
        summary: {
          score: correct, // no negative marking here
          totalQuestions,
          attempted,
          correct,
          incorrect,
          unattempted,
          timeTaken: 0,
          totalTime: 0
        },
        sections: sections.map(s => s.name),
        questions: sections.flatMap((sec, sIdx) => sec.questions.map((q, qIdx) => {
          const st = state[key(sIdx,qIdx)] || {};
          const answered = typeof st.sel === 'number';
          const marked = !!st.marked;
          return {
            id: undefined,
            section: sec.name,
            question: q.text || q.question || '',
            options: q.options,
            correct_option: typeof q.correct === 'number' ? (q.correct + 1) : null,
            userAnswer: answered ? st.sel : null,
            status: marked ? (answered ? 'marked-answered' : 'marked') : (answered ? 'answered' : 'not-answered')
          };
        }))
      };

      try{
        const attempts = JSON.parse(localStorage.getItem('quizAttempts')||'[]');
        attempts.unshift(attempt);
        localStorage.setItem('quizAttempts', JSON.stringify(attempts));
      }catch(e){ console.error('Failed saving attempt from inline quiz:', e); }

      // Redirect to dedicated result page
      window.location.href = `result.html?id=${attemptId}`;
    }

    // Init
    renderQuestion(); renderPalette();
  </script>
</body>
</html>
