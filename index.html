<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test - Sectional</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Icons for the checkmark -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Header -->
    <header class="d-flex justify-content-between align-items-center p-2 bg-white border-bottom">
        <h5 class="mb-0">SSC Stenographer 2025 - Free Mock Test</h5>
        <div class="timer-container">
            <span>Time Left</span>
            <div id="timer" class="timer-box">
                <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span>
            </div>
        </div>
        <button class="btn btn-outline-secondary btn-sm">Show Fullscreen</button>
    </header>

    <div class="container-fluid mt-2">
        <div class="row">
            <!-- Left Column: Questions -->
            <div class="col-md-9">
                <div class="question-area bg-white p-3">
                    <!-- Section Tabs -->
                    <ul class="nav nav-tabs">
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="General Awareness">General Awareness</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="English Language">English Language</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="Logical Reasoning">Logical Reasoning</a>
                        </li>
                    </ul>

                    <!-- Question Content -->
                    <div class="question-content mt-3">
                        <div id="result-summary" class="d-none">
                            <!-- Result summary will be injected here by JS -->
                        </div>
                        <p class="fw-bold" id="question-number">No. 1</p>
                        <div id="question-text" class="mb-4">
                            <!-- Question will be loaded here by JS -->
                        </div>
                        <div id="options-container">
                            <!-- Options will be loaded here by JS -->
                        </div>
                    </div>
                </div>

                <!-- Bottom Buttons -->
                <div id="test-navigation-btns" class="bottom-nav d-flex justify-content-between align-items-center bg-light p-3 mt-2">
                     <div>
                        <button id="mark-review-btn" class="btn btn-primary">Mark for Review & Next</button>
                        <button id="clear-response-btn" class="btn btn-danger">Clear Response</button>
                     </div>
                     <button id="save-next-btn" class="btn btn-success">Save & Next</button>
                </div>
            </div>

            <!-- Right Column: Navigation & Info -->
            <div class="col-md-3">
                <div class="right-panel bg-white p-3">
                    <div class="user-info d-flex align-items-center mb-3">
                        <img src="https://via.placeholder.com/40" class="rounded-circle" alt="User">
                        <span class="ms-2 fw-bold">Guest User</span>
                    </div>

                    <div class="legend border p-2 mb-3">
                        <div class="d-flex justify-content-around flex-wrap">
                            <span class="legend-item"><span class="box answered"></span> Answered</span>
                            <span class="legend-item"><span class="box not-answered"></span> Not Answered</span>
                            <span class="legend-item"><span class="box not-visited"></span> Not Visited</span>
                            <span class="legend-item"><span class="box marked"></span> Marked</span>
                            <span class="legend-item"><span class="box marked-answered"></span> Marked & Answered</span>
                        </div>
                    </div>

                    <div class="section-title border-top pt-2">
                        <p class="fw-bold" id="section-title-text">Section: ...</p>
                        <div id="question-palette" class="question-palette">
                            <!-- Question number buttons will be loaded here by JS -->
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-3">
                        <button class="btn btn-outline-primary">Question Paper</button>
                        <button class="btn btn-outline-primary">Instructions</button>
                        <button id="submit-test-btn" class="btn btn-primary">Submit Test</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
